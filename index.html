<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旭日中授章お祝い会 受付管理システム (Firebase版)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- QRCode.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- html5-qrcode -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Sans+Serif&display=swap');
        .font-serif-jp { font-family: 'Noto Serif JP', serif; }
        .bg-gold-gradient { background: linear-gradient(135deg, #b89742 0%, #dfc475 50%, #b89742 100%); }
        .text-gold { color: #b89742; }
        
        /* 印刷時専用のスタイル調整 */
        @media print {
            body { background-color: white !important; }
            @page { size: A4 portrait; margin: 15mm; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen font-sans">

    <!-- ============================================== -->
    <!-- アプリケーション画面 (印刷時は非表示になります) -->
    <!-- ============================================== -->
    <div id="app-content" class="print:hidden flex flex-col min-h-screen">
        
        <!-- ヘッダー -->
        <header class="bg-slate-900 text-white shadow-md border-b-4 border-[#b89742]">
            <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 rounded-full bg-gold-gradient flex items-center justify-center text-slate-900 font-bold text-xl shadow">祝</div>
                    <div>
                        <h1 class="text-lg md:text-xl font-bold tracking-wider font-serif-jp text-[#dfc475]">旭日中授章 受章お祝い会</h1>
                        <p class="text-xs text-slate-400">出欠登録 ＆ 当日受付スマートシステム</p>
                    </div>
                </div>
                
                <!-- タブ切り替え -->
                <div class="flex bg-slate-800 p-1 rounded-lg border border-slate-700 w-full md:w-auto">
                    <button id="btn-tab-guest" class="flex-1 md:flex-none px-4 py-2 rounded-md text-sm font-semibold transition-all duration-200 bg-gold-gradient text-slate-950 shadow">
                        <i class="fa-solid fa-user-pen"></i> ゲスト用
                    </button>
                    <button id="btn-tab-admin" class="flex-1 md:flex-none px-4 py-2 rounded-md text-sm font-semibold transition-all duration-200 text-slate-400 hover:text-white">
                        <i class="fa-solid fa-user-shield"></i> 主催者用
                    </button>
                </div>
            </div>
        </header>

        <!-- メインコンテンツ -->
        <main class="flex-grow max-w-6xl w-full mx-auto p-4 space-y-6">

            <!-- 【システム状態表示】 -->
            <div id="auth-status-container" class="bg-blue-50 border border-blue-200 text-blue-800 px-4 py-3 rounded-lg text-sm flex items-center gap-2">
                <i class="fa-solid fa-spinner fa-spin"></i> <span>Firebase接続および認証を確認中...</span>
            </div>

            <!-- ============================================== -->
            <!-- 1. ゲスト用ビュー -->
            <!-- ============================================== -->
            <div id="view-guest" class="space-y-6">
                
                <!-- 確認・領収書発行エリア -->
                <div class="bg-white rounded-xl p-6 shadow-sm border border-slate-200">
                    <h3 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-magnifying-glass text-[#b89742]"></i> 登録内容の確認・受付票(領収書)発行
                    </h3>
                    <p class="text-sm text-slate-600 mb-4">登録済みのメールアドレスを入力してください。振込が確認できている場合、受付票兼領収書を発行・表示できます。</p>
                    <div class="flex flex-col sm:flex-row gap-2 max-w-md">
                        <input type="email" id="search-guest-email" placeholder="メールアドレスを入力" class="flex-grow px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#b89742]">
                        <button id="btn-search-guest" class="bg-slate-900 hover:bg-slate-800 text-white font-bold px-5 py-2 rounded-lg transition-colors flex items-center justify-center gap-2">
                            確認する <i class="fa-solid fa-arrow-right"></i>
                        </button>
                    </div>
                    <div id="guest-status-result" class="mt-4 hidden p-5 rounded-lg border"></div>
                </div>

                <!-- 登録フォーム -->
                <div id="form-container" class="bg-white rounded-xl p-6 md:p-8 shadow-sm border border-slate-200">
                    <h3 class="text-xl font-bold text-slate-800 mb-6 flex items-center gap-2 border-b pb-3 border-slate-100">
                        <i class="fa-solid fa-pen-to-square text-[#b89742]"></i> 新規出欠回答フォーム
                    </h3>
                    <form id="attendance-form" class="space-y-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="md:col-span-2">
                                <label class="block text-sm font-bold text-slate-700 mb-2">ご出欠 <span class="text-red-500">*</span></label>
                                <div class="grid grid-cols-2 gap-4">
                                    <label class="flex items-center justify-center p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:bg-slate-50 transition-all [&:has(input:checked)]:border-[#b89742] [&:has(input:checked)]:bg-amber-50/50">
                                        <input type="radio" name="attendance" value="出席" required class="sr-only" checked>
                                        <span class="text-base font-bold flex items-center gap-2"><i class="fa-solid fa-circle-check text-emerald-500"></i> ご出席</span>
                                    </label>
                                    <label class="flex items-center justify-center p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:bg-slate-50 transition-all [&:has(input:checked)]:border-slate-400 [&:has(input:checked)]:bg-slate-100">
                                        <input type="radio" name="attendance" value="欠席" class="sr-only">
                                        <span class="text-base font-bold text-slate-500 flex items-center gap-2"><i class="fa-solid fa-circle-xmark text-rose-500"></i> ご欠席</span>
                                    </label>
                                </div>
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-slate-700 mb-1">お名前 <span class="text-red-500">*</span></label>
                                <input type="text" id="input-name" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-[#b89742]">
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-slate-700 mb-1">フリガナ <span class="text-red-500">*</span></label>
                                <input type="text" id="input-kana" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-[#b89742]">
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-slate-700 mb-1">メールアドレス <span class="text-red-500">*</span></label>
                                <input type="email" id="input-email" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-[#b89742]">
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-slate-700 mb-1">御社名・御役職など</label>
                                <input type="text" id="input-organization" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-[#b89742]">
                            </div>
                            <div class="md:col-span-2">
                                <label class="block text-sm font-bold text-slate-700 mb-1">お祝いメッセージ</label>
                                <textarea id="input-message" rows="3" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-[#b89742]"></textarea>
                            </div>
                        </div>
                        <button type="submit" class="w-full bg-gold-gradient hover:opacity-90 text-slate-950 font-bold text-lg py-3 rounded-xl shadow-md transition-all">
                            送信する <i class="fa-solid fa-paper-plane ml-1"></i>
                        </button>
                    </form>
                </div>
            </div>

            <!-- ============================================== -->
            <!-- 2. 主催者用管理画面ビュー -->
            <!-- ============================================== -->
            <div id="view-admin" class="space-y-6 hidden">
                <!-- ダッシュボード -->
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                        <p class="text-xs text-slate-500 font-bold">登録総数</p>
                        <h4 id="stat-total" class="text-2xl font-bold text-slate-800">0 名</h4>
                    </div>
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                        <p class="text-xs text-slate-500 font-bold">出席予定</p>
                        <h4 id="stat-attending" class="text-2xl font-bold text-emerald-600">0 名</h4>
                    </div>
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                        <p class="text-xs text-slate-500 font-bold">振込確認済</p>
                        <h4 id="stat-paid" class="text-2xl font-bold text-blue-600">0 名</h4>
                    </div>
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                        <p class="text-xs text-slate-500 font-bold">来場済</p>
                        <h4 id="stat-checkedin" class="text-2xl font-bold text-indigo-600">0 名</h4>
                    </div>
                </div>

                <!-- QRコードスキャナー -->
                <div class="bg-slate-900 text-white rounded-xl p-6 shadow-md border border-[#b89742]/50">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-lg font-bold text-[#dfc475]"><i class="fa-solid fa-qrcode"></i> 当日受付スキャン</h3>
                        <div>
                            <button id="btn-start-scanner" class="bg-emerald-600 px-4 py-2 rounded-lg text-sm font-bold"><i class="fa-solid fa-camera"></i> 起動</button>
                            <button id="btn-stop-scanner" class="bg-rose-600 px-4 py-2 rounded-lg text-sm font-bold hidden"><i class="fa-solid fa-video-slash"></i> 停止</button>
                        </div>
                    </div>
                    <div id="reader-container" class="w-full max-w-sm mx-auto overflow-hidden rounded-lg bg-slate-950 relative hidden">
                        <div id="reader" style="width: 100%;"></div>
                    </div>
                    <div id="scan-feedback" class="w-full max-w-md mx-auto mt-4 p-4 rounded-lg text-center font-bold hidden"></div>
                </div>

                <!-- ゲストリスト -->
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="p-4 border-b flex justify-between items-center">
                        <h3 class="text-lg font-bold">ゲスト一覧</h3>
                        <div class="flex gap-2">
                            <input type="text" id="admin-search" placeholder="検索..." class="px-3 py-1 border rounded text-sm w-32 md:w-auto">
                            <button id="btn-inject-sample" class="px-2 py-1 text-xs bg-slate-100 rounded border">デモ追加</button>
                            <button id="btn-clear-all" class="px-2 py-1 text-xs bg-rose-50 text-rose-600 rounded border border-rose-200">全削除</button>
                        </div>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead class="bg-slate-50 text-slate-500 text-xs uppercase">
                                <tr>
                                    <th class="px-4 py-3">名前</th>
                                    <th class="px-4 py-3">出欠</th>
                                    <th class="px-4 py-3">振込状況</th>
                                    <th class="px-4 py-3">受付状況</th>
                                    <th class="px-4 py-3 text-center">領収書印刷</th>
                                    <th class="px-4 py-3 text-right">操作</th>
                                </tr>
                            </thead>
                            <tbody id="admin-table-body" class="divide-y text-sm"></tbody>
                        </table>
                    </div>
                </div>
            </div>

        </main>

        <footer class="bg-slate-900 text-slate-400 text-xs text-center py-6 mt-12">
            <p>旭日中授章 受章お祝い会 運営事務局</p>
        </footer>
    </div>

    <!-- ============================================== -->
    <!-- 印刷時専用の領収書・受付票レイアウト (通常時は非表示) -->
    <!-- ============================================== -->
    <div id="print-area" class="hidden print:block w-full bg-white p-8">
        <!-- JavaScriptで内容を流し込みます -->
    </div>

    <!-- モーダル用（QRコード表示） -->
    <div id="qr-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden no-print">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 text-center space-y-4 shadow-2xl relative">
            <button id="btn-close-modal" class="absolute top-4 right-4 text-slate-400 text-xl"><i class="fa-solid fa-xmark"></i></button>
            <h4 class="text-lg font-bold font-serif-jp">出席受付用QRコード</h4>
            <p id="qr-modal-guest-name" class="font-bold text-[#b89742]"></p>
            <div class="flex justify-center p-4 bg-slate-50 rounded-xl"><div id="modal-qrcode-container"></div></div>
            <div class="flex gap-2">
                <button id="modal-print-btn" class="flex-1 bg-slate-900 text-[#dfc475] font-bold py-2 rounded-lg text-xs"><i class="fa-solid fa-print"></i> 領収書印刷</button>
                <button id="btn-close-modal-footer" class="flex-1 bg-slate-100 text-slate-800 font-bold py-2 rounded-lg text-xs">閉じる</button>
            </div>
        </div>
    </div>

    <!-- ============================================== -->
    <!-- Firebase Logic -->
    <!-- ============================================== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-analytics.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, deleteDoc, updateDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'celebration-app-2026';
        
        const firebaseConfig = {
            apiKey: "AIzaSyAeOFhEVvwvWN2Cf7Mh2w9HFoEw5-WTfW8",
            authDomain: "celebration-reception-system.firebaseapp.com",
            projectId: "celebration-reception-system",
            storageBucket: "celebration-reception-system.firebasestorage.app",
            messagingSenderId: "918326808821",
            appId: "1:918326808821:web:d23cdc70792dfcc2e9f5bc",
            measurementId: "G-TK7TWD4BDH"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let guests = [];
        let html5QrCode = null;

        // 【修正ポイント】認証処理の安定化
        async function runAuth() {
            try {
                const initialToken = (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) ? __initial_auth_token : null;
                if (initialToken) {
                    await signInWithCustomToken(auth, initialToken);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) {
                console.error("Auth Error:", err);
                const statusEl = document.getElementById('auth-status-container');
                if (statusEl) {
                    statusEl.innerHTML = '<i class="fa-solid fa-triangle-exclamation text-rose-600"></i> <span class="text-rose-800 font-bold">認証エラー: Firebaseコンソールで「匿名認証」を有効にしてください。</span>';
                    statusEl.className = "bg-rose-50 border border-rose-200 px-4 py-3 rounded-lg text-sm flex items-center gap-2";
                }
            }
        }

        // 【修正ポイント】認証状態の変化を監視し、認証が完了した後にDB同期を開始する
        onAuthStateChanged(auth, (user) => {
            const statusEl = document.getElementById('auth-status-container');
            if (user) {
                if (statusEl) {
                    statusEl.innerHTML = '<i class="fa-solid fa-check text-emerald-600"></i> <span class="text-emerald-800 font-bold">データベース接続完了（同期中）</span>';
                    statusEl.className = "bg-emerald-50 border border-emerald-200 px-4 py-3 rounded-lg text-sm flex items-center gap-2";
                }
                // 認証が成功した場合のみ、Firestoreの監視を開始する
                startRealtimeSync();
            }
        });

        function startRealtimeSync() {
            const ref = collection(db, 'artifacts', appId, 'public', 'data', 'guests');
            onSnapshot(ref, (snapshot) => {
                guests = [];
                snapshot.forEach(doc => guests.push({ id: doc.id, ...doc.data() }));
                
                updateStats();
                if (!document.getElementById('view-admin').classList.contains('hidden')) {
                    renderAdminList();
                }
                
                const emailInput = document.getElementById('search-guest-email')?.value;
                if (emailInput && !document.getElementById('guest-status-result').classList.contains('hidden')) {
                    checkGuestStatus(true);
                }
            }, (error) => {
                console.error("Sync error:", error);
                const statusEl = document.getElementById('auth-status-container');
                if (statusEl) {
                    statusEl.innerHTML = '<i class="fa-solid fa-xmark text-rose-600"></i> <span class="text-rose-800 font-bold">データ同期エラー: 権限がありません。</span>';
                }
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            runAuth();
            switchView('guest');
            setupEventListeners();
        });

        function setupEventListeners() {
            document.getElementById('btn-tab-guest').addEventListener('click', () => switchView('guest'));
            document.getElementById('btn-tab-admin').addEventListener('click', () => switchView('admin'));
            document.getElementById('btn-search-guest').addEventListener('click', () => checkGuestStatus(false));
            document.getElementById('attendance-form').addEventListener('submit', handleFormSubmit);
            document.getElementById('admin-search').addEventListener('input', renderAdminList);
            document.getElementById('btn-start-scanner').addEventListener('click', startScanner);
            document.getElementById('btn-stop-scanner').addEventListener('click', stopScanner);
            document.getElementById('btn-inject-sample').addEventListener('click', injectSampleData);
            document.getElementById('btn-clear-all').addEventListener('click', clearAllData);
            document.getElementById('btn-close-modal').addEventListener('click', closeQrModal);
            document.getElementById('btn-close-modal-footer').addEventListener('click', closeQrModal);
        }

        function updateStats() {
            document.getElementById('stat-total').innerText = guests.length + ' 名';
            document.getElementById('stat-attending').innerText = guests.filter(g => g.attendance === '出席').length + ' 名';
            document.getElementById('stat-paid').innerText = guests.filter(g => g.paid).length + ' 名';
            document.getElementById('stat-checkedin').innerText = guests.filter(g => g.checkedIn).length + ' 名';
        }

        window.switchView = function(view) {
            if (view === 'admin') {
                const pass = prompt("管理者パスワードを入力してください (初期値: 1123)");
                if (pass !== "1123") return alert("パスワードが違います");
            }
            document.getElementById('view-guest').classList.toggle('hidden', view !== 'guest');
            document.getElementById('view-admin').classList.toggle('hidden', view !== 'admin');
            
            document.getElementById('btn-tab-guest').className = view === 'guest' ? "flex-1 md:flex-none px-4 py-2 rounded-md text-sm font-semibold transition-all bg-gold-gradient text-slate-950 shadow" : "flex-1 md:flex-none px-4 py-2 rounded-md text-sm font-semibold transition-all text-slate-400 hover:text-white";
            document.getElementById('btn-tab-admin').className = view === 'admin' ? "flex-1 md:flex-none px-4 py-2 rounded-md text-sm font-semibold transition-all bg-gold-gradient text-slate-950 shadow" : "flex-1 md:flex-none px-4 py-2 rounded-md text-sm font-semibold transition-all text-slate-400 hover:text-white";
            
            if (view === 'admin') renderAdminList();
        };

        window.handleFormSubmit = async function(e) {
            e.preventDefault();
            if (!auth.currentUser) return alert('データベースに接続されていません');

            const id = 'GST-' + Math.random().toString(36).substr(2, 9).toUpperCase();
            const newGuest = {
                name: document.getElementById('input-name').value.trim(),
                kana: document.getElementById('input-kana').value.trim(),
                email: document.getElementById('input-email').value.trim().toLowerCase(),
                organization: document.getElementById('input-organization').value.trim(),
                message: document.getElementById('input-message').value.trim(),
                attendance: document.querySelector('input[name="attendance"]:checked').value,
                paid: false, checkedIn: false,
                createdAt: new Date().toLocaleString('ja-JP')
            };

            if (guests.find(g => g.email === newGuest.email)) {
                return alert('このメールアドレスは既に登録されています');
            }

            try {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'guests', id), newGuest);
                document.getElementById('attendance-form').reset();
                alert("登録が完了しました。ご入力のメールアドレスで照会が可能です。");
            } catch (err) {
                console.error(err);
                alert("登録エラーが発生しました");
            }
        };

        window.checkGuestStatus = function(silent = false) {
            const email = document.getElementById('search-guest-email').value.trim().toLowerCase();
            const res = document.getElementById('guest-status-result');
            if (!email) {
                if(!silent) alert("メールアドレスを入力してください");
                return;
            }

            const guest = guests.find(g => g.email === email);
            res.classList.remove('hidden');

            if (!guest) {
                res.innerHTML = `<p class="text-rose-600 font-bold"><i class="fa-solid fa-circle-exclamation"></i> 登録が見つかりません</p>`;
                return;
            }

            if (guest.attendance === '欠席') {
                res.innerHTML = `<p>ご欠席で登録されています。</p>`;
                return;
            }

            if (!guest.paid) {
                res.innerHTML = `
                    <div class="text-amber-600 font-bold mb-2"><i class="fa-solid fa-circle-info"></i> 会費未振込（確認中）です</div>
                    <div class="bg-slate-50 p-3 rounded text-sm">【お振込先】葵銀行 東京中央支店(普通)1234567<br>振込名義の前にID <strong>${guest.id}</strong> をご入力ください。</div>
                `;
            } else {
                res.innerHTML = `
                    <div class="flex items-center gap-4">
                        <div id="status-qrcode" class="p-2 bg-white border rounded"></div>
                        <div>
                            <h4 class="font-bold text-lg">${guest.name} 様</h4>
                            <p class="text-xs text-emerald-600 font-bold border border-emerald-200 bg-emerald-50 inline-block px-2 rounded mb-2">振込確認済</p>
                            <button onclick="printGuestTicket('${guest.id}')" class="block w-full bg-slate-900 text-[#dfc475] px-3 py-2 rounded text-sm font-bold">
                                <i class="fa-solid fa-print"></i> 領収書 兼 受付票を印刷
                            </button>
                        </div>
                    </div>
                `;
                setTimeout(() => {
                    document.getElementById('status-qrcode').innerHTML = '';
                    new QRCode(document.getElementById('status-qrcode'), { text: guest.id, width: 100, height: 100, correctLevel: QRCode.CorrectLevel.H });
                }, 50);
            }
        };

        window.printGuestTicket = function(id) {
            const guest = guests.find(g => g.id === id);
            if (!guest) return;

            const tempDiv = document.createElement('div');
            new QRCode(tempDiv, { text: guest.id, width: 150, height: 150, correctLevel: QRCode.CorrectLevel.H });

            setTimeout(() => {
                const qrCanvas = tempDiv.querySelector('canvas');
                const qrImgSrc = qrCanvas ? qrCanvas.toDataURL() : '';
                const today = new Date().toLocaleDateString('ja-JP');

                const printArea = document.getElementById('print-area');
                printArea.innerHTML = `
                    <div style="max-width: 800px; margin: 0 auto; font-family: 'Helvetica Neue', Arial, sans-serif; color: #333;">
                        <div style="text-align: center; border-bottom: 3px double #b89742; padding-bottom: 15px; margin-bottom: 30px;">
                            <h1 style="font-size: 28px; margin: 0;">旭日中授章 受章お祝い会</h1>
                            <h2 style="font-size: 18px; color: #666; margin: 5px 0 0 0;">出席受付票 兼 領収書</h2>
                        </div>
                        
                        <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 40px;">
                            <div>
                                <p style="font-size: 28px; font-weight: bold; margin: 0; border-bottom: 1px solid #333; padding-bottom: 5px; min-width: 300px;">
                                    ${guest.name} 様
                                </p>
                                <p style="font-size: 14px; margin-top: 5px; color: #555;">${guest.organization}</p>
                            </div>
                            <div style="text-align: right;">
                                <p style="margin: 0; font-size: 14px;">発行日：${today}</p>
                                <p style="font-size: 24px; font-weight: bold; margin: 10px 0 5px 0;">金額： ¥15,000 -</p>
                                <p style="font-size: 12px; color: #666; margin: 0;">但し、お祝い会会費として上記正に領収いたしました。</p>
                            </div>
                        </div>

                        <div style="text-align: center; margin: 40px 0;">
                            <img src="${qrImgSrc}" style="width: 150px; height: 150px; margin: 0 auto; border: 1px solid #ccc; padding: 10px;" />
                            <p style="font-family: monospace; font-size: 14px; margin-top: 10px; color: #666;">ID: ${guest.id}</p>
                        </div>

                        <div style="background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 20px;">
                            <p style="font-weight: bold; margin-top: 0; font-size: 16px;">【当日のご案内】</p>
                            <p style="margin: 8px 0; font-size: 14px;">・日時：2026年11月23日（祝） 17:00開宴 (16:30受付開始)</p>
                            <p style="margin: 8px 0; font-size: 14px;">・場所：帝国ホテル 鳳凰の間</p>
                            <p style="margin: 8px 0; font-size: 14px; color: #b89742; font-weight: bold;">※当日は本票を印刷してお持ちいただくか、スマートフォンの画面を受付にご提示ください。</p>
                        </div>
                    </div>
                `;

                window.print();
            }, 100);
        };

        window.renderAdminList = function() {
            const tbody = document.getElementById('admin-table-body');
            const search = document.getElementById('admin-search')?.value.toLowerCase() || '';
            tbody.innerHTML = '';
            
            const filtered = guests.filter(g => g.name.toLowerCase().includes(search) || g.id.toLowerCase().includes(search));
            
            filtered.forEach(g => {
                const tr = document.createElement('tr');
                const btnPay = g.attendance === '出席' 
                    ? `<button onclick="toggleField('${g.id}', 'paid', ${!g.paid})" class="px-2 py-1 rounded text-xs ${g.paid ? 'bg-blue-600 text-white' : 'bg-slate-200'}">${g.paid ? '振込済' : '未確認'}</button>` 
                    : '-';
                const btnCheck = g.attendance === '出席' 
                    ? `<button onclick="toggleField('${g.id}', 'checkedIn', ${!g.checkedIn})" class="px-2 py-1 rounded text-xs ${g.checkedIn ? 'bg-indigo-600 text-white' : 'bg-slate-200'}">${g.checkedIn ? '来場済' : '未受付'}</button>` 
                    : '-';
                const btnPrint = (g.attendance === '出席' && g.paid)
                    ? `<button onclick="printGuestTicket('${g.id}')" class="px-2 py-1 bg-slate-800 text-[#dfc475] rounded text-xs"><i class="fa-solid fa-print"></i></button>`
                    : '-';

                tr.innerHTML = `
                    <td class="px-4 py-2 border-b"><div class="font-bold">${g.name}</div><div class="text-xs text-slate-400">${g.id}</div></td>
                    <td class="px-4 py-2 border-b">${g.attendance}</td>
                    <td class="px-4 py-2 border-b">${btnPay}</td>
                    <td class="px-4 py-2 border-b">${btnCheck}</td>
                    <td class="px-4 py-2 border-b text-center">${btnPrint}</td>
                    <td class="px-4 py-2 border-b text-right"><button onclick="deleteGuest('${g.id}')" class="text-rose-500"><i class="fa-trash-can fa-solid"></i></button></td>
                `;
                tbody.appendChild(tr);
            });
        };

        window.toggleField = async function(id, field, value) {
            try { await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'guests', id), { [field]: value }); } 
            catch(e) { console.error(e); }
        };

        window.deleteGuest = async function(id) {
            if(confirm('削除しますか？')) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'guests', id));
        };

        window.startScanner = function() {
            document.getElementById('reader-container').classList.remove('hidden');
            document.getElementById('btn-start-scanner').classList.add('hidden');
            document.getElementById('btn-stop-scanner').classList.remove('hidden');
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, async (text) => {
                const id = text.trim();
                const g = guests.find(x => x.id === id);
                if(g && g.attendance === '出席' && g.paid && !g.checkedIn) {
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'guests', id), { checkedIn: true });
                    alert(`${g.name}様の受付が完了しました！`);
                } else {
                    alert('無効なQRコード、または振込未確認です');
                }
            }, () => {}).catch(err => alert("カメラを起動できません"));
        };

        window.stopScanner = function() {
            if(html5QrCode) html5QrCode.stop();
            document.getElementById('reader-container').classList.add('hidden');
            document.getElementById('btn-start-scanner').classList.remove('hidden');
            document.getElementById('btn-stop-scanner').classList.add('hidden');
        };

        window.injectSampleData = async function() {
            const id = 'GST-DEMO' + Date.now().toString().slice(-4);
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'guests', id), {
                name: '千代田 栄一', kana: 'チヨダ エイイチ', email: 'test@example.com', organization: '〇〇株式会社',
                attendance: '出席', paid: true, checkedIn: false, createdAt: new Date().toLocaleString()
            });
        };

        window.openQrModal = function(id) {
            const guest = guests.find(g => g.id === id);
            if (!guest) return;
            document.getElementById('qr-modal-guest-name').innerText = guest.name + ' 様';
            const qrContainer = document.getElementById('modal-qrcode-container');
            qrContainer.innerHTML = ''; 
            new QRCode(qrContainer, { text: guest.id, width: 180, height: 180, correctLevel: QRCode.CorrectLevel.H });
            document.getElementById('modal-print-btn').onclick = () => printGuestTicket(guest.id);
            document.getElementById('qr-modal').classList.remove('hidden');
        };

        window.closeQrModal = function() {
            document.getElementById('qr-modal').classList.add('hidden');
        };

    </script>
</body>
</html>
