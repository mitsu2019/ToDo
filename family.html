<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ファミリースケジュール</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* グリッドを7列に固定し、中身がはみ出さないように設定 */
        .calendar-grid { 
            display: grid; 
            grid-template-columns: repeat(7, 1fr); 
            gap: 1px; 
            background-color: #e5e7eb; 
            width: 100%;
        }
        .calendar-day { 
            min-height: 100px; 
            background-color: white; 
            padding: 4px; 
            display: flex; 
            flex-direction: column; 
            gap: 2px; 
            overflow: hidden;
        }
        .bg-dinner-yes { background-color: #dcfce7 !important; border-left: 3px solid #22c55e; }
        .bg-dinner-no { background-color: #fee2e2 !important; border-left: 3px solid #ef4444; }
        .bg-has-plan { border-right: 3px solid #3b82f6; }
        .tab-active { border-bottom: 3px solid #3b82f6; color: #3b82f6; font-weight: bold; }
        #lock-screen { position: fixed; inset: 0; background: white; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        @media (max-width: 640px) { .calendar-day { min-height: 90px; font-size: 0.7rem; } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <!-- ロック画面 -->
    <div id="lock-screen">
        <div class="p-8 bg-white rounded-3xl shadow-xl border border-slate-100 text-center max-w-xs w-full">
            <h2 class="text-xl font-bold mb-6 text-slate-700">パスワード入力</h2>
            <input type="password" id="pass-input" class="w-full p-4 bg-slate-50 border rounded-2xl mb-4 text-center text-lg focus:ring-2 focus:ring-slate-300 outline-none" placeholder="Password">
            <button id="unlock-btn" class="w-full py-4 bg-slate-800 text-white rounded-2xl font-bold shadow-lg active:bg-slate-700">ログイン</button>
            <p id="pass-error" class="text-red-500 text-xs mt-3 hidden">パスワードが違います</p>
        </div>
    </div>

    <!-- メインコンテンツ -->
    <div id="app" class="max-w-4xl mx-auto p-4 pb-20 opacity-0 transition-opacity duration-500">
        <header id="app-header" class="flex justify-center items-center py-4">
            <h1 id="title" class="text-xl font-extrabold text-slate-700">ファミリースケジュール</h1>
        </header>

        <div class="flex mb-4 border-b bg-white rounded-t-xl overflow-hidden shadow-sm">
            <button id="btn-view-calendar" class="flex-1 py-4 tab-active">カレンダー表示</button>
            <button id="btn-view-batch" class="flex-1 py-4 text-slate-400">まとめて入力</button>
        </div>

        <!-- カレンダー表示 -->
        <section id="view-calendar">
            <div class="flex items-center justify-between mb-4 bg-white p-3 rounded-xl shadow-sm border border-slate-200">
                <button id="prev-month" class="p-2 border rounded-full w-10 h-10 flex items-center justify-center">◀</button>
                <h2 id="month-display" class="font-bold text-lg text-slate-700"></h2>
                <button id="next-month" class="p-2 border rounded-full w-10 h-10 flex items-center justify-center">▶</button>
            </div>
            <div class="calendar-grid rounded-xl overflow-hidden border border-slate-200 shadow-md">
                <div class="bg-slate-100 p-1 text-center text-[10px] font-bold text-red-400">Sun</div>
                <div class="bg-slate-100 p-1 text-center text-[10px] font-bold text-slate-500">Mon</div>
                <div class="bg-slate-100 p-1 text-center text-[10px] font-bold text-slate-500">Tue</div>
                <div class="bg-slate-100 p-1 text-center text-[10px] font-bold text-slate-500">Wed</div>
                <div class="bg-slate-100 p-1 text-center text-[10px] font-bold text-slate-500">Thu</div>
                <div class="bg-slate-100 p-1 text-center text-[10px] font-bold text-slate-500">Fri</div>
                <div class="bg-slate-100 p-1 text-center text-[10px] font-bold text-blue-400">Sat</div>
                <div id="calendar-days" class="contents"></div>
            </div>
        </section>

        <!-- 一括入力表示 -->
        <section id="view-batch" class="hidden">
            <div id="batch-input-list" class="space-y-3"></div>
        </section>
    </div>

    <!-- 編集モーダル -->
    <div id="edit-modal" class="fixed inset-0 bg-slate-900/60 hidden flex items-center justify-center p-4 z-50 backdrop-blur-sm">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl">
            <h3 id="modal-date-title" class="text-lg font-extrabold mb-4 text-center border-b pb-2"></h3>
            <p class="text-xs font-bold text-slate-400 mb-2 uppercase">🍚 晩ご飯</p>
            <div class="grid grid-cols-2 gap-2 mb-4">
                <button data-group="dinner" data-status="dinner-yes" class="modal-btn py-3 bg-slate-100 rounded-xl font-bold">いる</button>
                <button data-group="dinner" data-status="dinner-no" class="modal-btn py-3 bg-slate-100 rounded-xl font-bold">不要</button>
            </div>
            <p class="text-xs font-bold text-slate-400 mb-2 uppercase">📅 予定</p>
            <div class="grid grid-cols-2 gap-2 mb-4">
                <button data-group="isTrip" class="modal-toggle-btn py-3 bg-slate-100 rounded-xl font-bold">出張</button>
                <button data-group="isPlan" class="modal-toggle-btn py-3 bg-slate-100 rounded-xl font-bold">予定</button>
            </div>
            <div id="modal-comment-container" class="hidden">
                <textarea id="modal-comment" class="w-full p-3 bg-slate-50 border rounded-xl text-sm mb-4" rows="2" placeholder="詳細を入力..."></textarea>
            </div>
            <button id="save-btn" class="w-full py-4 bg-slate-800 text-white rounded-2xl font-bold mb-2 shadow-lg">保存する</button>
            <button id="close-modal" class="w-full text-slate-400 text-xs py-2 text-center">キャンセル</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA4gVP3A9Ls3z0gKUFA0GmJu_pDgTYwg3s",
            authDomain: "family-acca5.firebaseapp.com",
            projectId: "family-acca5",
            storageBucket: "family-acca5.firebasestorage.app",
            messagingSenderId: "793497834481",
            appId: "1:793497834481:web:69dc5e8419fc7d467baa50"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        // 【復旧】データがあった時点の名前
        const COLLECTION_NAME = "schedules_v3";
        const APP_PASSWORD = "family"; 

        let currentDate = new Date();
        let user = null;
        let scheduleData = {};
        let selectedDateKey = null;
        let editState = { dinner: null, isTrip: false, isPlan: false };

        // パスワード認証
        document.getElementById('unlock-btn').onclick = () => {
            const val = document.getElementById('pass-input').value;
            if (val === APP_PASSWORD) {
                document.getElementById('lock-screen').style.display = 'none';
                document.getElementById('app').classList.remove('opacity-0');
                localStorage.setItem('family_app_unlocked', 'true');
            } else {
                document.getElementById('pass-error').classList.remove('hidden');
            }
        };

        if (localStorage.getItem('family_app_unlocked') === 'true') {
            document.getElementById('lock-screen').style.display = 'none';
            document.getElementById('app').classList.remove('opacity-0');
        }

        const renderAll = () => {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const weekdays = ["日", "月", "火", "水", "木", "金", "土"];
            
            document.getElementById('month-display').textContent = `${year}年 ${month + 1}月`;
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const firstDay = new Date(year, month, 1).getDay();
            
            // カレンダー描画
            const calContainer = document.getElementById('calendar-days');
            calContainer.innerHTML = '';
            
            // 月初より前の空白セル
            for (let i = 0; i < firstDay; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'calendar-day bg-slate-50/50 border-b border-r';
                calContainer.appendChild(emptyCell);
            }

            for (let d = 1; d <= daysInMonth; d++) {
                const dateKey = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const data = scheduleData[dateKey] || {};
                const dayEl = document.createElement('div');
                const isSun = new Date(year, month, d).getDay() === 0;
                const isSat = new Date(year, month, d).getDay() === 6;

                dayEl.className = `calendar-day border-b border-r cursor-pointer hover:bg-slate-50 transition-colors ${data.dinner === 'dinner-yes' ? 'bg-dinner-yes' : data.dinner === 'dinner-no' ? 'bg-dinner-no' : ''} ${ (data.isTrip || data.isPlan) ? 'bg-has-plan' : ''}`;
                
                let labels = '';
                if(data.dinner === 'dinner-yes') labels += '🍚';
                if(data.dinner === 'dinner-no') labels += '✖';
                if(data.isTrip) labels += '✈';
                if(data.isPlan) labels += '📅';
                
                dayEl.innerHTML = `
                    <div class="text-[9px] font-bold ${isSun ? 'text-red-400' : isSat ? 'text-blue-400' : 'text-slate-400'}">${d}</div>
                    <div class="text-center text-xs flex-grow flex items-center justify-center">${labels}</div>
                    <div class="text-[8px] text-slate-500 truncate h-3">${data.comment || ''}</div>
                `;
                dayEl.onclick = () => window.openModal(dateKey);
                calContainer.appendChild(dayEl);
            }

            // まとめて入力リスト描画
            const list = document.getElementById('batch-input-list');
            list.innerHTML = '';
            for (let d = 1; d <= daysInMonth; d++) {
                const dateKey = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const dateObj = new Date(year, month, d);
                const dayOfWeek = weekdays[dateObj.getDay()];
                const data = scheduleData[dateKey] || {};
                const row = document.createElement('div');
                row.className = 'p-3 bg-white rounded-xl border shadow-sm flex flex-col gap-2';
                
                const hasPlan = data.isTrip || data.isPlan;

                row.innerHTML = `
                    <div class="flex justify-between font-bold text-xs"><span>${d}日(${dayOfWeek})</span></div>
                    <div class="grid grid-cols-4 gap-1">
                        <button onclick="window.quickSave('${dateKey}', {dinner: '${data.dinner === 'dinner-yes' ? '' : 'dinner-yes'}'})" class="py-2 text-[10px] rounded-lg border ${data.dinner==='dinner-yes'?'bg-green-500 text-white font-bold':'bg-slate-50 text-slate-400'}">いる</button>
                        <button onclick="window.quickSave('${dateKey}', {dinner: '${data.dinner === 'dinner-no' ? '' : 'dinner-no'}'})" class="py-2 text-[10px] rounded-lg border ${data.dinner==='dinner-no'?'bg-red-500 text-white font-bold':'bg-slate-50 text-slate-400'}">不要</button>
                        <button onclick="window.quickSave('${dateKey}', {isTrip: ${!data.isTrip}})" class="py-2 text-[10px] rounded-lg border ${data.isTrip?'bg-yellow-400 text-white font-bold':'bg-slate-50 text-slate-400'}">出張</button>
                        <button onclick="window.quickSave('${dateKey}', {isPlan: ${!data.isPlan}})" class="py-2 text-[10px] rounded-lg border ${data.isPlan?'bg-blue-500 text-white font-bold':'bg-slate-50 text-slate-400'}">予定</button>
                    </div>
                    <div class="${hasPlan ? '' : 'hidden'} mt-1">
                        <input type="text" placeholder="詳細コメントを入力" 
                            class="w-full p-2 bg-slate-50 border rounded-lg text-xs outline-none focus:ring-1 focus:ring-slate-300"
                            value="${data.comment || ''}"
                            onblur="window.quickSave('${dateKey}', {comment: this.value})"
                        >
                    </div>
                `;
                list.appendChild(row);
            }
        };

        window.quickSave = async (dateKey, updates) => {
            const oldData = scheduleData[dateKey] || { dinner: null, isTrip: false, isPlan: false, comment: '' };
            const newData = { ...oldData, ...updates, updatedAt: serverTimestamp() };
            await setDoc(doc(db, COLLECTION_NAME, dateKey), newData);
        };

        window.openModal = (dateKey) => {
            selectedDateKey = dateKey;
            const data = scheduleData[dateKey] || { dinner: null, isTrip: false, isPlan: false, comment: '' };
            editState = { dinner: data.dinner, isTrip: data.isTrip || false, isPlan: data.isPlan || false };
            document.getElementById('modal-date-title').textContent = dateKey;
            document.getElementById('modal-comment').value = data.comment || '';
            updateModalUI();
            document.getElementById('edit-modal').classList.remove('hidden');
        };

        const updateModalUI = () => {
            document.querySelectorAll('[data-group="dinner"]').forEach(btn => {
                const isActive = editState.dinner === btn.dataset.status;
                const colors = { 'dinner-yes': 'bg-green-500 text-white', 'dinner-no': 'bg-red-500 text-white' };
                btn.className = `modal-btn py-3 rounded-xl font-bold transition-all ${isActive ? colors[btn.dataset.status] : 'bg-slate-100 text-slate-400'}`;
            });
            const toggleBtns = { isTrip: 'bg-yellow-400 text-white', isPlan: 'bg-blue-500 text-white' };
            Object.keys(toggleBtns).forEach(key => {
                const btn = document.querySelector(`[data-group="${key}"]`);
                btn.className = `modal-toggle-btn py-3 rounded-xl font-bold transition-all ${editState[key] ? toggleBtns[key] : 'bg-slate-100 text-slate-400'}`;
            });
            document.getElementById('modal-comment-container').classList.toggle('hidden', !(editState.isTrip || editState.isPlan));
        };

        document.querySelectorAll('.modal-btn').forEach(btn => { btn.onclick = () => { editState.dinner = (editState.dinner === btn.dataset.status) ? null : btn.dataset.status; updateModalUI(); }; });
        document.querySelectorAll('.modal-toggle-btn').forEach(btn => { btn.onclick = () => { const key = btn.dataset.group; editState[key] = !editState[key]; updateModalUI(); }; });
        
        document.getElementById('save-btn').onclick = async () => {
            const comment = document.getElementById('modal-comment').value;
            await setDoc(doc(db, COLLECTION_NAME, selectedDateKey), { ...editState, comment: comment.trim(), updatedAt: serverTimestamp() });
            document.getElementById('edit-modal').classList.add('hidden');
        };

        document.getElementById('close-modal').onclick = () => document.getElementById('edit-modal').classList.add('hidden');
        document.getElementById('prev-month').onclick = () => { currentDate.setMonth(currentDate.getMonth()-1); renderAll(); };
        document.getElementById('next-month').onclick = () => { currentDate.setMonth(currentDate.getMonth()+1); renderAll(); };
        
        document.getElementById('btn-view-calendar').onclick = () => {
            document.getElementById('view-calendar').classList.remove('hidden');
            document.getElementById('view-batch').classList.add('hidden');
            document.getElementById('app-header').classList.remove('hidden');
            document.getElementById('btn-view-calendar').classList.add('tab-active');
            document.getElementById('btn-view-batch').classList.remove('tab-active');
            document.getElementById('btn-view-batch').classList.add('text-slate-400');
        };
        document.getElementById('btn-view-batch').onclick = () => {
            document.getElementById('view-batch').classList.remove('hidden');
            document.getElementById('view-calendar').classList.add('hidden');
            document.getElementById('app-header').classList.add('hidden');
            document.getElementById('btn-view-batch').classList.add('tab-active');
            document.getElementById('btn-view-batch').classList.remove('text-slate-400');
            document.getElementById('btn-view-calendar').classList.remove('tab-active');
        };

        onAuthStateChanged(auth, (u) => {
            user = u;
            if (user) {
                onSnapshot(collection(db, COLLECTION_NAME), (snap) => {
                    scheduleData = {};
                    snap.forEach(d => scheduleData[d.id] = d.data());
                    renderAll();
                }, (err) => console.error("Firestore Error:", err));
            } else { 
                signInAnonymously(auth); 
            }
        });
        
        renderAll();
    </script>
</body>
</html>
